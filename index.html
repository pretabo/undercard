<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UnderCard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <div class="page-header__brand">
        <p class="page-header__eyebrow">Mobile Prototype</p>
        <h1>UnderCard</h1>
      </div>
      <div class="page-header__actions">
        <button id="full-log-button" class="secondary-button" type="button">Log</button>
        <button id="restart-button" class="secondary-button" type="button">Reset</button>
      </div>
    </header>

    <section class="game-shell">
      <div id="startup-error" class="startup-error" hidden></div>

      <div id="app-content" class="app-content">
        <section class="turn-director">
          <div class="turn-director__copy">
            <p id="director-title" class="director-title"></p>
            <p id="director-subtitle" class="director-subtitle"></p>
          </div>
          <div class="turn-director__actions">
            <button id="director-primary" class="primary-button" type="button"></button>
          </div>
        </section>

        <p id="outcome-banner" class="outcome-banner" hidden></p>
        <div id="move-toast" class="move-toast" role="status" aria-live="polite" hidden></div>

        <section class="field-layout">
          <div class="summary-column">
            <article id="enemy-summary" class="wrestler-block wrestler-block--enemy" data-state="steady">
              <div class="wrestler-block__header">
                <h2 id="enemy-name" class="wrestler-block__name"></h2>
                <span id="enemy-role" class="role-chip"></span>
              </div>
              <p id="enemy-stats" class="wrestler-block__stats"></p>
              <p id="enemy-pin" class="wrestler-block__pin"></p>
              <p id="enemy-status" class="wrestler-block__status"></p>
            </article>

            <article id="player-summary" class="wrestler-block wrestler-block--player" data-state="steady">
              <div class="wrestler-block__header">
                <h2 id="player-name" class="wrestler-block__name"></h2>
                <span id="player-role" class="role-chip"></span>
              </div>
              <p id="player-stats" class="wrestler-block__stats"></p>
              <p id="player-pin" class="wrestler-block__pin"></p>
              <p id="player-status" class="wrestler-block__status"></p>
            </article>
          </div>

          <div class="field-main">
            <section class="inspector-panel sequence-panel">
              <div class="panel-row">
                <div class="panel-title">
                  <h2></h2>
                </div>
                <p id="sequence-combo" class="panel-meter"></p>
              </div>
              <div id="sequence-slots" class="sequence-slots"></div>
            </section>

            <section class="inspector-panel recent-panel">
              <div class="panel-row">
                <div class="panel-title">
                  <h2>Recent Events</h2>
                </div>
              </div>
              <div class="recent-body">
                <ol id="recent-events-list" class="recent-list"></ol>
              </div>
            </section>
          </div>
        </section>

        <section class="bottom-dock">
          <section class="inspector-panel hand-panel" aria-label="Your hand">
            <div class="panel-row">
              <div class="hand-panel__info">
                <p id="player-pin-summary" class="panel-meter hand-panel__pin-summary"></p>
                <p id="draw-pile-count" class="panel-meter"></p>
              </div>
              <button id="hand-menu-button" class="secondary-button hand-menu-button" type="button" aria-label="Open hand menu">☰</button>
            </div>

            <div id="hand-cards" class="hand-grid"></div>
          </section>

        </section>

      </div>
    </section>
  </main>

  <div id="log-modal" class="log-modal" hidden>
    <button class="log-modal__backdrop" type="button" aria-label="Close match log"></button>
    <div class="log-modal__panel">
      <div class="log-modal__header">
        <h2>Match Log</h2>
        <button id="close-log-button" class="secondary-button" type="button">Close</button>
      </div>
      <div class="log-modal__body">
        <ol id="match-log-list"></ol>
      </div>
    </div>
  </div>

  <div id="card-modal" class="card-modal" hidden>
    <button class="card-modal__backdrop" type="button" aria-label="Close card details"></button>
    <div class="card-modal__panel">
      <div class="card-modal__header">
        <div>
          <p id="card-modal-type" class="card-modal__type"></p>
          <h2 id="card-modal-title" class="card-modal__title"></h2>
        </div>
        <button id="close-card-button" class="secondary-button" type="button">Close</button>
      </div>
      <div class="card-modal__stats">
        <p id="card-modal-meta" class="card-modal__meta"></p>
        <p id="card-modal-value" class="card-modal__value"></p>
        <p id="card-modal-reason" class="card-modal__reason"></p>
      </div>
      <p id="card-modal-effect" class="card-modal__effect"></p>
      <div class="card-modal__actions">
        <button id="card-modal-action" class="primary-button" type="button">Play Card</button>
      </div>
    </div>
  </div>

  <div id="pin-modal" class="pin-modal" hidden>
    <button class="pin-modal__backdrop" type="button" aria-label="Close pin breakdown"></button>
    <div class="pin-modal__panel">
      <div class="pin-modal__header">
        <div>
          <p class="pin-modal__eyebrow">Pin breakdown</p>
          <h2 id="pin-modal-title" class="pin-modal__title"></h2>
        </div>
        <button id="close-pin-button" class="secondary-button" type="button">Close</button>
      </div>
      <div class="pin-modal__body">
        <p id="pin-modal-stats" class="pin-modal__stats"></p>
      </div>
    </div>
  </div>

  <div id="rolloff-modal" class="rolloff-modal" hidden>
    <button class="rolloff-modal__backdrop" type="button" aria-label="Close roll-off"></button>
    <div class="rolloff-modal__panel">
      <p id="rolloff-title" class="rolloff-modal__title">Roll-Off</p>
      <div class="rolloff-modal__grid">
        <article id="rolloff-attacker-card" class="rolloff-modal__fighter">
          <p id="rolloff-attacker-name" class="rolloff-modal__name"></p>
          <p id="rolloff-attacker-roll" class="rolloff-modal__roll"></p>
        </article>
        <article id="rolloff-defender-card" class="rolloff-modal__fighter">
          <p id="rolloff-defender-name" class="rolloff-modal__name"></p>
          <p id="rolloff-defender-roll" class="rolloff-modal__roll"></p>
        </article>
      </div>
      <p id="rolloff-result" class="rolloff-modal__result"></p>
      <button id="close-rolloff-button" class="primary-button" type="button">Continue</button>
    </div>
  </div>

  <div id="hand-menu-modal" class="hand-menu-modal" hidden>
    <button class="hand-menu-modal__backdrop" type="button" aria-label="Close hand menu"></button>
    <div class="hand-menu-modal__panel">
      <div class="hand-menu-modal__header">
        <h2>Hand Menu</h2>
        <button id="close-hand-menu-button" class="secondary-button" type="button">Close</button>
      </div>
      <div class="hand-menu-modal__actions">
        <button id="hand-menu-stop-early" class="primary-button" type="button">Stop Early</button>
        <button class="secondary-button" type="button">Placeholder Option 1</button>
        <button class="secondary-button" type="button">Placeholder Option 2</button>
        <button class="secondary-button" type="button">Placeholder Option 3</button>
      </div>
    </div>
  </div>

  <div id="pin-count-overlay" class="pin-count-overlay" hidden>
    <div class="pin-count-overlay__backdrop"></div>
    <p id="pin-count-value" class="pin-count-overlay__value">1</p>
  </div>
  <script src="game-engine.js"></script>
  <script src="main.js"></script>
</body>
</html>
